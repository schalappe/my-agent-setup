name: Setup Python environment
description: Install uv, the Python from .python-version, and the locked dependencies. Caller must check out first.

inputs:
  working-directory:
    description: uv project directory
    required: false
    default: .

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@LATEST
      with:
        enable-cache: true
        cache-dependency-glob: ${{ inputs.working-directory }}/uv.lock

    # --locked fails when uv.lock is out of date with pyproject.toml instead of rewriting it.
    - run: uv sync --locked
      shell: bash
      working-directory: ${{ inputs.working-directory }}
